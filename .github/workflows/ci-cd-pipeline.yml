name: IntelliSupport CI/CD Pipeline

# This is the trigger. It tells GitHub: 
# Only wake up and run this robot when someone pushes code directly to the master or main branches
# If you push to a branch named test-branch, the robot stays asleep.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # GitHub doesn't run your code on magic air. 
  # It actually spins up a brand new, empty Linux computer (an Ubuntu server) 
  # in their own data center just to test your code.
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Start Databases for Testing
      run: docker compose up -d postgres redis zookeeper kafka

    - name: Run Backend Integration Tests
      working-directory: ./backend
      run: ./mvnw clean test

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

  deploy-to-production:
    # The 'needs' keyword is the most important part of CD. 
    # It tells GitHub: "DO NOT run this unless build-and-test passes perfectly!"
    needs: build-and-test
    
    # We only want to deploy to the live server if the code was pushed to main or master
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    # this tells GitHub to download a mini-program 
    # (written by a user named appleboy) whose only job 
    # is to automatically open an SSH terminal for you.
    - name: Deploy to Cloud Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/intelli-support-ai
          git pull origin master
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          docker-compose down
          docker-compose up -d --build
